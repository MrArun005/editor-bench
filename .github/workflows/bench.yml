name: editor-bench

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app ids, or "all": friedliver,cursor,antigravity-ide,vscode,antigravity,opencode'
        required: false
        default: 'vscode,friedliver'
      variants:
        description: 'Settings-variant arms <app>+<variant>, comma-separated, or "none" (variants: settings-perf)'
        required: false
        default: 'friedliver+settings-perf'
      friedliver_ref:
        description: 'Extra "FriedLiver patched" arm: a FriedLiver-Code release tag, or a Build FriedLiver run id[/artifact]. Empty = none'
        required: false
        default: ''
      scenarios:
        description: 'slow-shell,large-repo, "all" or "none" (run on VS Code + FriedLiver arms only)'
        required: false
        default: 'all'
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC

permissions:
  contents: read

concurrency:
  group: editor-bench
  cancel-in-progress: false

jobs:
  bench:
    runs-on: macos-latest     # Apple Silicon (arm64)
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.FRIEDLIVER_TOKEN || github.token }}   # FriedLiver-Code is public; PAT only if that changes
      # Inputs reach scripts only as environment variables. A scheduled run has no inputs: same defaults.
      BENCH_ONLY: ${{ inputs.apps || 'vscode,friedliver' }}
      BENCH_VARIANTS: ${{ inputs.variants || 'friedliver+settings-perf' }}
      BENCH_SCENARIOS: ${{ inputs.scenarios || 'all' }}
      FRIEDLIVER_REF: ${{ inputs.friedliver_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (parsing, stats, URL building)
        run: python3 -m unittest discover -s tests -v

      - name: Scratch dir
        run: |
          echo "BENCH_SCRATCH=$RUNNER_TEMP/bench" >> "$GITHUB_ENV"
          echo "BENCH_APPS=$RUNNER_TEMP/bench/apps.json" >> "$GITHUB_ENV"
          sw_vers; sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu; df -h /

      - name: Download + verify apps (official sources)
        run: python3 fetch_apps.py "$BENCH_SCRATCH"

      - name: Workspace fixtures (pinned commits)
        run: |
          case ",$BENCH_SCENARIOS," in
            *,large-repo,*|,all,) ./setup_fixture.sh "$BENCH_SCRATCH/fixture" "$BENCH_SCRATCH/bigrepo" ;;
            *) ./setup_fixture.sh "$BENCH_SCRATCH/fixture" ;;
          esac

      - name: Build window watcher
        run: swiftc -O winwait.swift -o "$BENCH_SCRATCH/winwait"

      - name: Benchmark (sequential, one app at a time)
        run: |
          python3 bench.py selftest
          python3 bench.py preflight
          python3 bench.py run
          python3 bench.py postflight

      - name: Report
        if: always()
        run: |
          if [ -s results/raw-runs.jsonl ]; then python3 report.py; fi
          {
            if [ -f REPORT.md ]; then cat REPORT.md; else echo "No results produced."; fi
            echo
            echo "---"
            echo "Charts: download the **editor-bench-report** artifact and open \`report.html\` (job summaries strip inline SVG)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-bench-report
          path: |
            results/*.json
            results/*.jsonl
            results/logs/
            REPORT.md
            report.html
          if-no-files-found: warn

      - name: Cleanup throwaway profiles
        if: always()
        run: python3 bench.py cleanup; rm -rf "$BENCH_SCRATCH"
