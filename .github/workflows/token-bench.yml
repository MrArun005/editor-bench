name: token-bench

# Token efficiency of FriedLiver's agents vs Claude Code, Codex, Gemini CLI and Cursor on PUBLIC repos
# only (token-bench/repos/public.json). A private repo never runs here: bench.py refuses a private
# config under CI, and this workflow only ever passes public.json.
#
# Manual trigger only, read-only token, API keys only in the live job's "Run" step.
# - unit: parser/guard tests + a replay of the synthetic fixtures. Free, no secrets.
# - free-checks: proves S4/S5's checks separate right from wrong edits, and measures the IDE side
#   (FriedLiver index build, S3 context cost per tool) with no LLM. Free, no secrets.
# - live (input live=true): the real runs. Each arm runs only when its key secret is set; with no
#   keys it does nothing. Costs money: see token-bench/README.md for the estimate.
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Run the paid live benchmark (needs API key secrets)'
        type: boolean
        default: false
      arms:
        description: 'Comma-separated arms (antigravity needs a desktop login: local only)'
        default: 'claude,friedliver-claude,cursor,codex,friedliver-codex,gemini,friedliver-gemini'
      reps:
        description: 'Repetitions per scenario'
        default: '3'
      scenarios:
        description: 'Scenario ids, empty = all (network scenarios such as S7 never run in CI)'
        default: ''
      upload_raw:
        description: 'Also upload raw agent transcripts (redacted). Default: parsed results only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: token-bench
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s token-bench/tests -v
      - name: Replay of the synthetic fixtures
        run: |
          python3 token-bench/bench.py run --config token-bench/repos/public.json --out "$RUNNER_TEMP/replay" \
            --replay token-bench/fixtures --arms claude,friedliver-claude,cursor,codex,friedliver-codex,gemini,friedliver-gemini,antigravity --reps 3
          python3 token-bench/bench.py import-manual --config token-bench/repos/public.json \
            --csv token-bench/fixtures/manual-antigravity-ide.sample.csv --out "$RUNNER_TEMP/replay"
          python3 token-bench/report.py "$RUNNER_TEMP/replay"
          python3 token-bench/bench.py estimate --config token-bench/repos/public.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: token-bench-replay
          path: |
            ${{ runner.temp }}/replay/results.jsonl
            ${{ runner.temp }}/replay/report.html

  free-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pinned checkouts (nest for edits, TypeScript v6.0.3 as the large repo)
        run: |
          python3 - <<'EOF'
          import sys, os
          sys.path.insert(0, 'token-bench')
          import bench
          cfg = bench.load_config('token-bench/repos/public.json')
          work = os.path.join(os.environ['RUNNER_TEMP'], 'work')
          os.makedirs(work, exist_ok=True)
          for name, spec in cfg['repos'].items():
              print(name, bench.prepare_repo(name, spec, work))
          EOF
      - name: S4/S5 checks fail on a wrong edit and pass on a right one
        run: python3 token-bench/checks/selfcheck.py "$RUNNER_TEMP/work/nest" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: FriedLiver's index code (public FriedLiver-Code)
        run: |
          git clone --depth 1 --quiet https://github.com/MrArun005/FriedLiver-Code.git "$RUNNER_TEMP/FriedLiver-Code"
          cd "$RUNNER_TEMP/FriedLiver-Code/extensions/friedliver-agents" && npm ci --ignore-scripts --no-audit --no-fund
      - name: IDE side - index build and S3 context cost per tool
        env:
          FRIEDLIVER_SRC: ${{ runner.temp }}/FriedLiver-Code
        run: |
          mkdir -p "$RUNNER_TEMP/ide"
          python3 token-bench/bench.py context-replay --config token-bench/repos/public.json \
            --repo-dir "$RUNNER_TEMP/work/typescript" --out "$RUNNER_TEMP/ide" | tee "$RUNNER_TEMP/ide/stdout.json"
      - uses: actions/upload-artifact@v4
        with:
          name: token-bench-ide-side
          path: ${{ runner.temp }}/ide

  live:
    if: inputs.live && github.repository == 'MrArun005/editor-bench'
    needs: [unit, free-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      # Cursor CLI, pinned: the tarball its install script fetches for this version, checked by SHA-256
      # (computed 2026-10-18). Bump both together; on a mismatch the Cursor arm is skipped.
      CURSOR_CLI_VERSION: '2026.10.16-e3cb207'
      CURSOR_CLI_SHA256: '3aa3f48cd7a3909a98c9b3f2a4085f0c021088bf826690b22c61f424c843e552'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the agent CLIs (no secrets in this step)
        run: |
          npm install -g @anthropic-ai/claude-code @agentclientprotocol/claude-agent-acp \
            @openai/codex @agentclientprotocol/codex-acp @google/gemini-cli
          tgz="$RUNNER_TEMP/cursor-agent.tgz"
          curl -fsSL -o "$tgz" "https://downloads.cursor.com/lab/${CURSOR_CLI_VERSION}/linux/x64/agent-cli-package.tar.gz"
          if echo "${CURSOR_CLI_SHA256}  $tgz" | sha256sum -c -; then
            dir="$HOME/.local/share/cursor-agent/versions/${CURSOR_CLI_VERSION}"
            mkdir -p "$dir" "$HOME/.local/bin"
            tar --strip-components=1 -xzf "$tgz" -C "$dir"
            ln -sf "$dir/cursor-agent" "$HOME/.local/bin/cursor-agent"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            echo "Cursor CLI checksum mismatch: the cursor arm is skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$tgz"
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BENCH_ARMS: ${{ inputs.arms }}
          BENCH_REPS: ${{ inputs.reps }}
          BENCH_SCENARIOS: ${{ inputs.scenarios }}
        run: |
          # bench.py gives each arm only its own key (arm_env), skips arms whose key is missing, runs
          # agents in throwaway checkouts, leaves out network scenarios under CI, and redacts
          # key-shaped strings from every transcript before it is written.
          python3 token-bench/bench.py run --config token-bench/repos/public.json --out "$RUNNER_TEMP/live" \
            --work "$RUNNER_TEMP/work" --arms "$BENCH_ARMS" --reps "$BENCH_REPS" --scenarios "$BENCH_SCENARIOS" --skip-missing-keys
          if [ -f "$RUNNER_TEMP/live/results.jsonl" ]; then python3 token-bench/report.py "$RUNNER_TEMP/live"; fi
      - name: Upload parsed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-bench-live
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/live/results.jsonl
            ${{ runner.temp }}/live/run.json
            ${{ runner.temp }}/live/report.html
      - name: Upload raw transcripts (opt-in)
        if: always() && inputs.upload_raw
        uses: actions/upload-artifact@v4
        with:
          name: token-bench-live-raw
          if-no-files-found: ignore
          path: ${{ runner.temp }}/live/raw
